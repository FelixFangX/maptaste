<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f6">
  <title>maptaste — A sense of place.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>
      <a href="https://github.com/FelixFangX" class="brand">maptaste<span> / 001</span></a>
      <div class="controls" role="group" aria-label="Map controls">
        <form id="place-control" class="place-control" role="search">
          <input id="place" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Place" placeholder="Place">
          <div class="place-presets">
            <button type="button" data-place="San Francisco">San Francisco</button>
            <button type="button" data-place="Tokyo">Tokyo</button>
            <button type="button" data-place="Shanghai">Shanghai</button>
            <button type="button" data-place="London">London</button>
            <button type="button" data-place="Paris">Paris</button>
          </div>
        </form>
        <div class="mode-control" role="group" aria-label="Before and after">
          <button type="button" data-mode="before" aria-pressed="false">Before</button>
          <button type="button" data-mode="after" aria-pressed="true">After</button>
        </div>
        <button id="theme" type="button" aria-label="Dark theme" aria-pressed="false">Dark</button>
      </div>
    </header>
    <main>
      <div class="intro"><h1>A sense of <em>place.</em></h1></div>
      <section class="map-shell" aria-label="Interactive building map">
        <div id="map"></div>
        <p id="map-status" role="status" hidden></p>
        <div class="place-caption" hidden><span class="place-title"></span><span id="place-coords"></span></div>
      </section>
      <footer><span>A little perspective changes everything.</span><span>Built with MapLibre</span></footer>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
