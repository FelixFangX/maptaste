name: check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate
      - name: Install from lockfiles
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir showcase install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc -p showcase --noEmit
      - name: Test
        run: pnpm test
      - name: Build
        run: |
          pnpm build
          pnpm --dir showcase build
